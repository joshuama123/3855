openapi: 3.0.3
info:
  description: Record fortnite battle stats and player kill stat
  version: "1.0.0"
  title: Fortnite API
  contact:
    email: hifortnite@gmail.com
paths:
  /fortnite/match: 
    post:
      summary: Reports how long a match of fortnite played
      operationId: app.report_match
      description: Adds a match time reading
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchReading'
      responses:
        '201':
          description: match reading successfully received
        '400':
          description: 'invalid input, object invalid'
    
  /fortnite/player-kills:
    post:
      summary: Reports a single precipitation reading
      operationId: app.report_player_kill
      description: Reports how many kills a player got in a match
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerKillReading'
      responses:
        '201':
          description: player kill reading successfully received
        '400':
          description: 'invalid input, object invalid'

components:
  schemas:
    MatchReading:
      required:
        - match_id
        - timeplayed_ms
        - timestamp
      properties:
        match_id:
          type: string
          format: uuid
          example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
        timeplayed:
          type: integer
          example: 213789
        timestamp:
          type: string
          format: date-time
          example: "2016-08-29T09:12:33.001Z"
      type: object

    PlayerKillReading:
      required:
        - player_id
        - match_id
        - kill_count
        - timestamp
      properties:
        player_id:
          type: string
          format: uuid
          example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
        match_id:
          type: string
          format: uuid
          example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
        kill_count:
          type: integer
          example: 15
        timestamp:
          type: string
          format: date-time
          example: "2016-08-29T09:12:33.001Z"
      type: object
